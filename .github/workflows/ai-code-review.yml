name: AI code review

on:
  # This workflow intentionally uses pull_request_target. It runs the
  # workflow and script from the base branch, never from the PR branch.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-code-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Checkout only the trusted base branch. The PR commit is fetched as
      # Git objects and inspected as text; no PR code is executed.
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          # Needed for the authenticated fetch below; no PR code is executed.
          persist-credentials: true

      - name: Fetch pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run OpenRouter review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'minimax/minimax-m3:free' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_REVIEW_MAX_DIFF_CHARS: '80000'
        run: python .github/scripts/ai_code_review.py
