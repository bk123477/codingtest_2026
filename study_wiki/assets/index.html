<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="코테 스터디 문제, 풀이 코드, 개념 노트와 기출 기록.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>코테 스터디 Wiki</title>
<link rel="stylesheet" href="style.css">
<script defer src="data.js"></script>
<script defer src="search.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<a class="skip" href="#main">본문으로 이동</a>
<aside class="sidebar">
<a class="brand" href="#"><span class="brand-icon">W</span><span>Study Wiki<small>코테 스터디</small></span></a>
<p class="nav-label">LIBRARY</p>
<nav aria-label="기록 유형" id="navigation">
<button data-kind="" class="nav-item active"><span>모든 기록</span><span id="nav-all">0</span></button>
<button data-kind="problem" class="nav-item"><span>코딩 문제</span><span id="nav-problem">0</span></button>
<button data-kind="note" class="nav-item"><span>학습 노트</span><span id="nav-note">0</span></button>
<button data-kind="ai_note" class="nav-item"><span>AI 개념 노트</span><span id="nav-ai">0</span></button>
<button data-view="concepts" class="nav-item"><span>개념 연결</span><span>↗</span></button>
<button data-view="exams" class="nav-item"><span>기출 모음</span><span>↗</span></button>
<button data-view="help" class="nav-item"><span>도움말</span><span>?</span></button>
</nav>
<div class="sidebar-section"><p class="nav-label">MY STUDY</p><label for="user">참여자</label><select id="user"><option value="">모든 참여자</option></select><p class="hint">참여자를 선택하면 개인 Wiki로 볼 수 있어요.</p></div>
<div class="sidebar-section"><p class="nav-label">TOPICS</p><div id="topics" class="topic-list"></div></div>
<div class="sidebar-footer"><span class="live-dot"></span> 코테 스터디 기록<br><a href="markdown/README.md">Markdown Wiki ↗</a></div>
</aside>
<main id="main">
<header class="topbar"><span>지식 라이브러리 <span class="slash">/</span> <span id="scope">전체 기록</span></span><span id="build-status" class="status">완료 기록</span></header>
<div class="workspace">
<section id="library">
<div class="intro"><div><p class="eyebrow">CODING TEST STUDY</p><h1>코테 스터디 Wiki</h1><p class="subtitle">문제와 풀이를 검색하고, 관련 개념과 학습 노트를 확인합니다.</p></div></div>
<div id="stats" class="stats"></div>
<div class="search-box"><span aria-hidden="true">⌕</span><label class="sr-only" for="search">기록 검색</label><input id="search" type="search" placeholder="제목, 문제 번호, 개념, 코드로 검색" autocomplete="off"><kbd>/</kbd></div>
<div class="filters">
<label>자료구조<select id="structure"><option value="">전체 자료구조</option></select></label>
<label>알고리즘<select id="algorithm"><option value="">전체 알고리즘</option></select></label>
<label>언어<select id="language"><option value="">전체 언어</option></select></label>
<label>기출<select id="exam"><option value="">전체 기출·일반 문제</option></select></label>
<label>출제 연도<select id="exam_year"><option value="">전체 연도</option></select></label>
<label>분류<select id="classification"><option value="">전체</option><option value="missing">미분류</option></select></label>
<label>정렬<select id="sort"><option value="newest">최신순</option><option value="oldest">오래된순</option><option value="title">제목순</option></select></label>
<button id="reset" class="text-button">초기화</button>
</div>
<div class="results-heading"><h2 id="list-title">모든 기록</h2><span id="result-count" role="status" aria-live="polite"></span></div>
<div id="active-topic"></div>
<div id="cards" class="cards"></div>
<div id="pagination" class="pagination"></div>
</section>
<section id="knowledge" hidden aria-label="Wiki 탐색"></section>
<section id="detail" hidden aria-label="기록 상세"></section>
<footer class="footer">Study Wiki <span>문제 · 풀이 · 개념 노트</span></footer>
</div>
</main>
<noscript>검색과 상세 화면에는 JavaScript가 필요합니다. <a href="markdown/README.md">Markdown Wiki</a>에서 기록을 읽을 수 있습니다.</noscript>
</body>
</html>
